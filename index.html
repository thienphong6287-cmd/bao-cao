 const KV=[["po",/^(p\.?\s?o\.?\s*(#|no\.?|number)?|purchase order( no\.?| number| #)?|số po|số đơn hàng)$/],["cust",/^(customer|buyer|client|khách hàng)( name)?$/],["fac",/^(factory|supplier|vendor|manufacturer|nhà máy|xưởng)( name)?$/],["no",/^(report\s*(#|no\.?|number)|số báo cáo)$/],["insp",/^(inspectors?|inspected by|người kiểm)$/],["date",/^(inspection date|ngày kiểm|date)$/],["desc",/^(product description|mô tả sản phẩm)$/]];
 const out={cover:{},items:[],sheet:""};
 for(const nm of wb.SheetNames){const A=X.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:"",raw:false,blankrows:true});let hr=-1,col={};
  for(let r=0;r<Math.min(A.length,80)&&hr<0;r++){const c={};A[r].forEach((v,i)=>{const t=lw(v);if(!t||t.length>45)return;for(const k in H)if(c[k]==null&&H[k].test(t)){if(k==="po"&&(H.ct.test(t)||H.sm.test(t)))continue;if(k==="name"&&H.code.test(t))continue;c[k]=i;break}});if(c.code!=null&&(c.name!=null||c.po!=null)){hr=r;col=c}}
  if(hr>=0&&!out.items.length){out.sheet=nm;let blank=0;const pos=new Set();
   for(let r=hr+1;r<A.length;r++){const row=A[r],code=nz(row[col.code]);if(!code){if(++blank>2)break;continue}blank=0;if(/^(total|tổng|sum|grand total)/i.test(code))break;
    const num=k=>col[k]==null?"":(String(row[col[k]]).replace(/[^\d.]/g,"").replace(/\.0+$/,"")||"");
    out.items.push({code,name:col.name==null?"":nz(row[col.name]),po:num("po"),ct:num("ct"),sm:num("sm")});if(col.pon!=null&&nz(row[col.pon]))pos.add(nz(row[col.pon]))}
   if(pos.size===1&&!out.cover.po)out.cover.po=[...pos][0]}
  for(let r=0;r<A.length;r++){if(r===hr)continue;for(let c=0;c<A[r].length;c++){const raw=nz(A[r][c]);if(!raw||raw.length>80)continue;
   let lab=raw,val="";const m=raw.match(/^([^:：]{1,40})[:：]\s*(.+)$/);if(m){lab=m[1];val=m[2]}lab=lw(lab);
   for(const[k,re]of KV){if(out.cover[k]||!re.test(lab))continue;if(!val){for(let j=c+1;j<Math.min(c+6,A[r].length);j++)if(nz(A[r][j])){val=nz(A[r][j]);break}if(!val&&A[r+1])val=nz(A[r+1][c])}
    if(val&&!KV.some(([,q])=>q.test(lw(val))))out.cover[k]=val;break}}}}
 if(out.cover.date){const d=new Date(out.cover.date);out.cover.date=isNaN(d)?"":new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

 const tq=out.items.reduce((a,x)=>a+(+x.po||0),0);if(tq&&!out.cover.qty)out.cover.qty=String(tq);
 return out}

 {const room=MAXI-S.skus.length;let k=0;m.querySelectorAll("[data-xi]").forEach(c=>{const isNew=!S.skus.some(z=>z.code.trim().toLowerCase()===R.items[+c.dataset.xi].code.toLowerCase());if(isNew&&++k>room)c.checked=false;c.onchange=lim})}lim();
