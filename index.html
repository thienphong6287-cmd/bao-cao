function mkPdf(pg,PW,PH){

 add("%PDF-1.4\n");
 obj(1,"<</Type/Catalog/Pages 2 0 R>>");
 obj(2,`<</Type/Pages/Count ${N}/Kids[${pg.map((_,i)=>(3+3*i)+" 0 R").join(" ")}]>>`);
 pg.forEach((p,i)=>{const a=3+3*i,c=a+1,m=a+2,s=`q ${PW} 0 0 ${PH} 0 0 cm /I Do Q`;
  obj(a,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</I ${m} 0 R>>>>/Contents ${c} 0 R${an[i].length?`/Annots[${an[i].map(n=>n+" 0 R").join(" ")}]`:""}>>`);
  obj(c,`<</Length ${s.length}>>`,s);
  obj(m,`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.b.size!==undefined?p.b.size:p.b.length}>>`,p.b)});
 const k=PW/1316,f=v=>v.toFixed(2);
 pg.forEach((p,i)=>(p.l||[]).forEach((l,j)=>obj(an[i][j],`<</Type/Annot/Subtype/Link/Rect[${f(l.x*k)} ${f(PH-(l.y+l.h)*k)} ${f((l.x+l.w)*k)} ${f(PH-l.y*k)}]/Border[0 0 0]/Dest[${3+3*l.t} 0 R/Fit]>>`)));
 const x=len;add(`xref\n0 ${tot+1}\n0000000000 65535 f \n`);
 for(let n=1;n<=tot;n++)add(String(off[n]).padStart(10,"0")+" 00000 n \n");
 add(`trailer\n<</Size ${tot+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"});
}

async function cloudShrink(L){let n=0,saved=0,ok=0,skip=0,bad=0,err="";for(const o of L){busyMsg(`Đang nén lại ảnh trên mây… ${++n}/${L.length}`);
  try{let b=asBlob(await idbGet("i",o.id));if(!b){const r=await fetch(syU("/storage/v1/object/authenticated/photos/"+syPath(o.id)),{headers:syH()});if(!r.ok){bad++;err=err||(await syErr(r,"Tải ảnh về lỗi")).message;continue}b=await r.blob()}
   const nb=await cfFit(await cloudJpg(new Blob([b],{type:"image/jpeg"})));if(!nb||nb.size>=o.sz*.9){skip++;continue}
   const r=await fetch(syU("/storage/v1/object/photos/"+syPath(o.id)),{method:"POST",headers:{...syH(),"Content-Type":"image/jpeg","x-upsert":"true"},body:nb});if(r.ok){saved+=o.sz-nb.size;ok++}else{bad++;err=err||(await syErr(r,"Ghi đè ảnh lỗi")).message}}catch(e){bad++;err=err||String(e&&e.message||e)}}
 busyEnd();alert(`Nén ảnh trên mây xong:\n• Đã nén: ${ok} ảnh (giải phóng ${MB(saved)})\n• Bỏ qua (đã nhỏ): ${skip}\n• Lỗi: ${bad}${err?"\n\nLỗi đầu tiên: "+err:""}`);return saved}
