<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#3b3b3b">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kiểm hàng"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Báo cáo kiểm hàng</title>
<style>
:root{--bg:#e9ebee;--card:#fff;--ink:#1d2127;--mut:#68707b;--hd:#3b3b3b;--acc:#f2b705;--line:#d3d7dc;--bad:#c0392b;--ok:#1e8e4e}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1f2227;--ink:#eceef1;--mut:#9aa1ab;--hd:#0c0d0f;--line:#33383f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--hd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:var(--acc);color:#222;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
main{padding:12px;max-width:720px;margin:auto}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.c h2{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
textarea{min-height:70px}
.r{display:flex;gap:8px}.r>*{flex:1}
button.b{background:var(--hd);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600}
button.b.y{background:var(--acc);color:#222}button.b.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}button.b.x{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row .t{flex:1}.row small{color:var(--mut);display:block}
.n{min-width:30px;text-align:center;border-radius:20px;padding:2px 8px;font-size:13px;font-weight:700;background:var(--bg)}
.n.on{background:var(--acc);color:#222}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .a{display:flex}.ph .a button{flex:1;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:9px 0;font-size:16px}
.ph input{border:0;border-radius:0;font-size:14px}
.res{font-weight:800;font-size:20px}.pass{color:var(--ok)}.fail{color:var(--bad)}
.tip{font-size:13px;color:var(--mut)}
#print{display:none}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff;color:#000}header,main{display:none}#print{display:block}
.pg{page-break-after:always;break-after:page}.pg h1{font-size:22px}.pg h2{font-size:16px;background:#3b3b3b;color:#fff;padding:6px 10px;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g figure{margin:0;break-inside:avoid}.g img{width:100%;height:58mm;object-fit:contain;background:#f3f3f3}.g figcaption{font-size:11px;min-height:14px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px 8px;text-align:left;font-size:13px}}
@media print{
@page{size:1316px 911px;margin:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.P{position:relative;width:1316px;height:911px;overflow:hidden;break-after:page;background:#fff;color:#000;font:14px Arial,Helvetica,sans-serif}
.P:last-child{break-after:auto}
.P a{color:#0563c1}
.hd{position:absolute;left:0;top:0;width:100%;height:72px;background:#3b3b3b;color:#fff;display:flex;align-items:center;padding:0 14px}
.hd.o{background:#f4b183;color:#000;height:80px}.hd.y{background:#ffc000;color:#000}
.hd .ht b{display:block;font-size:30px;line-height:1.1}.hd.t2 .ht b{font-size:24px}.hd small{display:block;font-size:19px;font-weight:700}
.hd .sk{margin-left:auto;margin-right:160px;font-size:38px;font-weight:700}
.ix{position:absolute;right:30px;top:0;width:120px;height:72px;background:#ffc000;clip-path:polygon(50% 0,100% 55%,84% 55%,84% 100%,16% 100%,16% 55%,0 55%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:16px}
.ix i{font-style:normal;text-decoration:underline}
.ft{position:absolute;left:34px;bottom:12px;background:#3b3b3b;color:#fff;font-size:17px;padding:6px 14px}
.P figure{position:absolute;margin:0;width:358px}.P figure img{width:100%;height:245px;object-fit:cover;display:block}
.P figcaption{border:1px solid #000;height:32px;margin-top:10px;padding:4px 8px;font-size:19px;overflow:hidden;white-space:nowrap}
.cl{position:absolute;font-weight:700;font-size:22px;text-decoration:underline}
.cb{position:absolute;border:1px solid #000;padding:6px 10px;font-size:18px;white-space:pre-wrap;overflow:hidden}
.di{position:absolute;top:160px;width:537px;height:405px;object-fit:cover}.dc{position:absolute;top:648px;width:537px;font-size:20px}
.fl{position:absolute;font-size:17px}.fb{position:absolute;height:52px;border:1px dotted #000;padding:10px 12px;font:700 20px Arial;color:#0070c0;overflow:hidden;white-space:nowrap}
.P table{border-collapse:collapse;width:100%;table-layout:fixed}
.P td,.P th{border:1px solid #000;padding:2px 6px;font-size:13px;text-align:left;overflow:hidden;line-height:1.25}
.P .tb{position:absolute;left:0;top:80px;width:100%}
.sh td{background:#f8cbad;font-weight:700}.oh th,.oh td{background:#f8cbad;font-weight:700}
.ix2 th,.ix2 td,.ctr th,.ctr td{text-align:center}.ix2 .sh td{text-align:left}.ix2 th{font-weight:700}
.rh{position:absolute!important;right:0;top:0;width:450px!important}
.rh th,.rh td{background:#3b3b3b;color:#fff;border:1px solid #fff;font-size:27px;font-weight:700;height:57px;padding:0 12px}
.pf{color:#00b050;font-weight:700}.pf.bad,.bad{color:#c00000}
.P .pt2{position:absolute;left:25px;top:100px;width:1245px}.pt2 th{background:#a6a6a6;height:78px;font-size:24px;border:0}
.pt2 td{font-size:30px;height:46px;border:0;background:#efefef}.pt2 .gr td+td{background:#00b050}
.P .it{position:absolute;left:18px;top:92px;width:750px}.it th{background:#a6a6a6;color:#fff;font-size:22px;height:42px;border:0}
.it td{height:46px;background:#e8e8e8;border:0;border-top:2px solid #fff}.lb{font-size:15px}.lb i{font-size:13px}.vl{font-size:22px;text-align:center!important}
.vd{position:absolute;left:786px;top:80px;bottom:0;width:2px;background:#000}
.pt{position:absolute;left:833px;font-size:24px;text-decoration:underline}.ri{position:absolute;left:845px;width:425px;height:315px;object-fit:cover}
}
@media print{
.P .ct{position:absolute}.P .ct td{font-size:20px;height:38px;padding:0 8px;border:1px solid #000}
.bx{position:absolute;width:220px;height:46px;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.lg{position:absolute;left:4px;bottom:10px;height:36px}
}
@media print{.bl{margin:0;padding-left:26px;list-style:disc}.bl li{margin:3px 0}}
@media print{.ix{right:22px;top:0;width:130px;height:84px;background:none;clip-path:none;display:block;padding:0}.ix svg{position:absolute;left:0;top:0}.ix i{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:17px}
.it td+td,.it th+th{border-left:2px solid #fff}.vl{text-align:left!important;padding-left:28px!important;white-space:normal;overflow-wrap:anywhere;line-height:1.2}
.fb{white-space:normal;padding:8px 12px;line-height:1.15}.eb{width:100%;height:245px;border:1px solid #999;background:#fafafa}}
.emp{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;background:var(--bg);color:var(--mut);font-size:13px;padding:6px}
@media print{.ix{width:96px;height:62px;top:5px;right:24px}.ix svg{width:96px;height:62px}.ix i{bottom:3px;font-size:13px}
.P .pt2 th,.P .pt2 td{border:2px solid #fff!important;text-align:left}.pt2 th{font-size:24px;height:78px}.pt2 td{font-size:26px;height:36px}
.pt2 tr:nth-child(even) td{background:#e0e0e0}.pt2 tr:nth-child(odd) td{background:#f0f0f0}.pt2 .gr td+td{background:#00b050!important}}
@media print{.P .chk td,.P .chk th{font-size:11px!important;padding:0 4px!important;line-height:1.12}}
label.b{display:block;text-align:center;position:relative;margin:0;background:var(--hd);color:#fff;border-radius:8px;padding:11px 14px;font-weight:600;font-size:16px;overflow:hidden}
label.b.y{background:var(--acc);color:#222}label.b.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
label.b input,.pk input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.ph .a .pk{flex:3;position:relative;text-align:center;padding:9px 0;border-top:1px solid var(--line);margin:0;color:var(--ink);font-size:14px;overflow:hidden}
@media print{.ix{width:112px;height:72px;top:0;right:24px}.ix svg{width:112px;height:72px}.ix i{bottom:3px;font-size:14px}
.hd.o .ix,.hd.y .ix{width:124px;height:80px}.hd.o .ix svg,.hd.y .ix svg{width:124px;height:80px}}
</style></head><body>
<header><button id="back" hidden>←</button><h1 id="ttl">Báo cáo kiểm hàng</h1><button id="exp">Xuất PDF</button></header>
<main id="app"></main><div id="print"></div>
<script>
const SEC=[["box","Box Selection","Chọn thùng"],["pack","Packaging Check","Kiểm tra thùng / chất lượng in"],["wt","Weight Check","Kiểm tra cân nặng"],["psz","Package Measurements","Kích thước thùng"],["lbl","Package Labels","Tem thùng"],["bar","Barcode Check","Kiểm tra mã vạch"],["mat","Package Materials","Vật liệu đóng gói"],["cmp","Components Check","Kiểm tra chi tiết rời"],["man","Manual Check","Hướng dẫn lắp ráp"],["moi","Moisture Check","Kiểm tra độ ẩm"],["col","Color Check","Kiểm tra màu"],["fit","Materials / Fittings","Kiểm vật tư"],["asm","Assembly on Site","Kiểm tra lắp ráp"],["psize","Product Measurement","Kích thước sản phẩm"],["pph","Product Photos","Hình sản phẩm"],["def","Defects Found","Lỗi tìm thấy"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let db,S,V={p:"home"},mem={};
const blank=()=>({cover:{no:"",cust:"",po:"",desc:"",qty:"",fac:"",insp:"",date:new Date().toISOString().slice(0,10),aC:0,aMa:3,aMi:5},skus:[]});
function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open("fir",1);q.onupgradeneeded=()=>{q.result.createObjectStore("m");q.result.createObjectStore("i")};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
const st=(n,m)=>db.transaction(n,m).objectStore(n);
const idbGet=(n,k)=>new Promise(r=>{try{const q=st(n).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const idbPut=(n,k,v)=>new Promise(r=>{try{const q=st(n,"readwrite").put(v,k);q.onsuccess=q.onerror=()=>r()}catch(e){r()}});
const idbDel=(n,k)=>new Promise(r=>{try{const q=st(n,"readwrite").delete(k);q.onsuccess=q.onerror=()=>r()}catch(e){r()}});
const save=()=>db&&idbPut("m","s",S);
const img=async id=>mem[id]||(mem[id]=await idbGet("i",id));
function comp(f){return new Promise(res=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8))};i.onerror=()=>res(null);i.src=u})}
const sku=()=>S.skus.find(s=>s.id===V.s);
const sec=()=>{const k=sku();return k.sec[V.k]||(k.sec[V.k]={ph:[],note:""})};
const cnt=(k,key)=>(k.sec[key]?.ph||[]).filter(p=>p.id).length;
const tot=()=>S.skus.reduce((a,k)=>(a[0]+=+k.d[0]||0,a[1]+=+k.d[1]||0,a[2]+=+k.d[2]||0,a),[0,0,0]);
const verdict=()=>{const t=tot(),c=S.cover;return t[0]<=+c.aC&&t[1]<=+c.aMa&&t[2]<=+c.aMi};

async function render(){
  const a=$("#app"),b=$("#back");b.hidden=V.p==="home";
  if(V.p==="home"){$("#ttl").textContent="Báo cáo kiểm hàng";const c=S.cover,t=tot(),ok=verdict();
    const f=(k,l,ty="text")=>`<label>${l}</label><input type="${ty}" value="${esc(c[k])}" data-c="${k}">`;
    a.innerHTML=`${/iPhone|iPad/.test(navigator.userAgent)&&!navigator.standalone?'<div class=c><h2>Cài lên iPhone</h2><p class=tip>Mở bằng Safari → nút Chia sẻ → "Thêm vào MH chính". Mở 1 lần khi có mạng, sau đó dùng offline.</p></div>':""}<div class=c><h2>Thông tin chung</h2>${f("no","Số báo cáo")}${f("cust","Khách hàng")}${f("po","PO#")}${f("desc","Mô tả sản phẩm")}<div class=r><div>${f("qty","SL kiểm / tổng (vd 50/285)")}</div><div>${f("date","Ngày kiểm","date")}</div></div>${f("fac","Nhà máy")}${f("insp","Inspector")}</div>
    <div class=c><h2>Kết quả AQL</h2><div class=r><div>${f("aC","Critical tối đa","number")}</div><div>${f("aMa","Major tối đa","number")}</div><div>${f("aMi","Minor tối đa","number")}</div></div>
    <p>Lỗi: Critical <b>${t[0]}</b> · Major <b>${t[1]}</b> · Minor <b>${t[2]}</b></p><div class="res ${ok?"pass":"fail"}">${ok?"PASS":"FAIL"}</div></div>
    <div class=c><h2>Sản phẩm (SKU)</h2>${S.skus.map(k=>{const n=SEC.reduce((s,x)=>s+cnt(k,x[0]),0);return`<div class=row data-s="${k.id}"><div class=t><b>${esc(k.code||"(chưa có mã)")}</b><small>${esc(k.name)}</small></div><span class="n ${n?"on":""}">${n} ảnh</span></div>`}).join("")||'<p class=tip>Chưa có SKU. Thêm SKU đầu tiên bên dưới.</p>'}
    <label>Mã SKU</label><input id=nc><label>Tên sản phẩm</label><input id=nn><p><button class="b y" id=add>Thêm SKU</button></p></div>
    ${cfgCard()}<div class=c><h2>Dữ liệu trong máy</h2><p class=tip>Mọi thứ tự lưu trong máy này. Nên sao lưu trước khi xóa dữ liệu trình duyệt.</p><div class=r><button class="b g" id=bk>Sao lưu</button><label class="b g">Khôi phục<input type=file accept=".json,application/json" id=rsf></label></div><p><button class="b y" id=pp>Xuất PowerPoint (.pptx)</button></p><p><button class="b g" id=px>Xuất PDF có link (qua hộp thoại in)</button></p><p><button class="b x" id=rm>Xóa toàn bộ</button></p></div>`;
    a.querySelectorAll("[data-c]").forEach(i=>i.oninput=()=>{S.cover[i.dataset.c]=i.value;save()});
    a.querySelectorAll("[data-c]").forEach(i=>i.onchange=render);
    a.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>{V={p:"sku",s:e.dataset.s};render()});
    $("#add").onclick=()=>{const code=$("#nc").value.trim();if(!code)return $("#nc").focus();S.skus.push({id:uid(),code,name:$("#nn").value.trim(),d:[0,0,0],sec:{}});save();render()};
    $("#pp").onclick=()=>doExp(2);$("#px").onclick=()=>doExp(1);
    a.querySelectorAll("[data-g]").forEach(i=>i.oninput=()=>{(S.cfg||(S.cfg={}))[i.dataset.g]=i.value;save()});
    $("#lg").onchange=async e=>{const d=await comp(e.target.files[0]);if(d){mem.logo=d;await idbPut("i","logo",d);(S.cfg||(S.cfg={})).logo=1;save();render()}};
    if($("#lgx"))$("#lgx").onclick=async()=>{delete S.cfg.logo;await idbDel("i","logo");delete mem.logo;save();render()};
    $("#bk").onclick=backup;$("#rsf").onchange=e=>restore(e.target.files[0]);
    $("#rm").onclick=async()=>{if(!confirm("Xóa toàn bộ báo cáo và ảnh trong máy? Không thể hoàn tác."))return;S=blank();mem={};if(db){st("i","readwrite").clear();await save()}render()};
  }else if(V.p==="sku"){const k=sku();$("#ttl").textContent=k.code;
    a.innerHTML=`<div class=c><h2>${esc(k.name)||"Sản phẩm"}</h2><p class=tip>Số lỗi tìm thấy (tính vào kết quả AQL)</p><div class=r>${["Critical","Major","Minor"].map((l,i)=>`<div><label>${l}</label><input type=number min=0 value="${k.d[i]}" data-d="${i}"></div>`).join("")}</div></div>
    <div class=c><h2>Số lượng (bảng kết quả)</h2><div class=r>${[["po","PO Q'ty"],["ct","Carton Q'ty"],["sm","Sample Size"]].map(([f,l])=>`<div><label>${l}</label><input type=number min=0 data-q="${f}" value="${esc(k.q?.[f]??"")}"></div>`).join("")}</div><p class=tip>Carton để trống = lấy bằng PO Q'ty.</p></div><div class=c><h2>Thông tin sản phẩm</h2>${PF.map(([f,e,v])=>`<label>${e} · ${v}</label><input data-f="${f}" value="${esc(f==="desc"?(k.f?.desc??k.name):(k.f?.[f]??""))}">`).join("")}</div><div class=c><h2>Hạng mục kiểm</h2>${SEC.map(x=>{const n=cnt(k,x[0]);return`<div class=row data-k="${x[0]}"><div class=t>${x[1]}<small>${x[2]}</small></div><span class="n ${n?"on":""}">${n}</span></div>`}).join("")}</div>
    <p><button class="b x" id=ds>Xóa SKU này</button></p>`;
    a.querySelectorAll("[data-q]").forEach(i=>i.oninput=()=>{(k.q||(k.q={}))[i.dataset.q]=i.value;save()});
    a.querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>{(k.f||(k.f={}))[i.dataset.f]=i.value;save()});
    a.querySelectorAll("[data-d]").forEach(i=>i.oninput=()=>{k.d[i.dataset.d]=Math.max(0,+i.value||0);save()});
    a.querySelectorAll("[data-k]").forEach(e=>e.onclick=()=>{V={p:"sec",s:k.id,k:e.dataset.k};render()});
    $("#ds").onclick=async()=>{if(!confirm("Xóa SKU "+k.code+" cùng toàn bộ ảnh?"))return;for(const x of Object.values(k.sec))for(const p of x.ph){await idbDel("i",p.id);delete mem[p.id]}S.skus=S.skus.filter(z=>z!==k);save();V={p:"home"};render()};
  }else{const k=sku(),x=sec(),def=SEC.find(z=>z[0]===V.k);$("#ttl").textContent=def[1];if(["lbl","bar"].includes(V.k)&&!x.ph[0]?.ref)x.ph.unshift({ref:1,id:null,cap:"Approved Carton Layout"});
    await Promise.all(x.ph.filter(p=>p.id).map(p=>img(p.id)));
    a.innerHTML=`<div class=c><p class=tip>${def[2]} · ${esc(k.code)}</p><div class=r><label class="b y">Chụp ảnh<input type=file accept="image/*" capture=environment id=fc></label><label class="b g">Chọn từ máy<input type=file accept="image/*" multiple id=fl></label></div></div>
    <div class=ph>${x.ph.map((p,i)=>`<figure>${p.id?`<img src="${mem[p.id]||""}" alt="">`:'<div class=emp>Ảnh mẫu — chưa có<br>(chọn từ máy)</div>'}<input placeholder="Chú thích" value="${esc(p.cap)}" data-i="${i}"><div class=a>${p.ref?`<label class=pk>Chọn ảnh từ máy<input type=file accept="image/*" data-rf="1"></label><button data-x="${i}" ${p.id?"":"disabled"}>🗑</button>`:`<button data-m="${i}:-1" ${i&&!x.ph[i-1].ref?"":"disabled"}>◀</button><button data-m="${i}:1" ${i<x.ph.length-1?"":"disabled"}>▶</button><button data-x="${i}">🗑</button>`}</div></figure>`).join("")}</div>
    ${x.ph.length?"":'<p class=tip>Chưa có ảnh. Bấm Chụp ảnh để bắt đầu.</p>'}

function mkPdf(pg,PW,PH){

 const N=pg.length;let nid=3+3*N;const an=pg.map(p=>(p.l||[]).map(()=>nid++)),tot=nid-1;
 add("%PDF-1.4\n");
 obj(1,"<</Type/Catalog/Pages 2 0 R>>");
 obj(2,`<</Type/Pages/Count ${N}/Kids[${pg.map((_,i)=>(3+3*i)+" 0 R").join(" ")}]>>`);
 pg.forEach((p,i)=>{const a=3+3*i,c=a+1,m=a+2,s=`q ${PW} 0 0 ${PH} 0 0 cm /I Do Q`;
  obj(a,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</I ${m} 0 R>>>>/Contents ${c} 0 R${an[i].length?`/Annots[${an[i].map(n=>n+" 0 R").join(" ")}]`:""}>>`);
  obj(c,`<</Length ${s.length}>>`,s);
  obj(m,`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.b.length}>>`,p.b)});
 const k=PW/1316,f=v=>v.toFixed(2);
 pg.forEach((p,i)=>(p.l||[]).forEach((l,j)=>obj(an[i][j],`<</Type/Annot/Subtype/Link/Rect[${f(l.x*k)} ${f(PH-(l.y+l.h)*k)} ${f((l.x+l.w)*k)} ${f(PH-l.y*k)}]/Border[0 0 0]/Dest[${3+3*l.t} 0 R/Fit]>>`)));
 const x=len;add(`xref\n0 ${tot+1}\n0000000000 65535 f \n`);
 for(let n=1;n<=tot;n++)add(String(off[n]).padStart(10,"0")+" 00000 n \n");
 add(`trailer\n<</Size ${tot+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"});
}
