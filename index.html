function mkPdf(pg,PW,PH){

 obj(2,`<</Type/Pages/Count ${N}/Kids[${pg.map((_,i)=>(3+3*i)+" 0 R").join(" ")}]>>`);
 pg.forEach((p,i)=>{const a=3+3*i,c=a+1,m=a+2,s=`q ${PW} 0 0 ${PH} 0 0 cm /I Do Q`;
  obj(a,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</I ${m} 0 R>>>>/Contents ${c} 0 R${an[i].length?`/Annots[${an[i].map(n=>n+" 0 R").join(" ")}]`:""}>>`);
  obj(c,`<</Length ${s.length}>>`,s);
  obj(m,`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.b.size!==undefined?p.b.size:p.b.length}>>`,p.b)});
 const k=PW/1316,f=v=>v.toFixed(2);
 pg.forEach((p,i)=>(p.l||[]).forEach((l,j)=>obj(an[i][j],`<</Type/Annot/Subtype/Link/Rect[${f(l.x*k)} ${f(PH-(l.y+l.h)*k)} ${f((l.x+l.w)*k)} ${f(PH-l.y*k)}]/Border[0 0 0]/Dest[${3+3*l.t} 0 R/Fit]>>`)));
 const x=len;add(`xref\n0 ${tot+1}\n0000000000 65535 f \n`);
 for(let n=1;n<=tot;n++)add(String(off[n]).padStart(10,"0")+" 00000 n \n");
 add(`trailer\n<</Size ${tot+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);

}

   if(x.name)k.name=x.name;k.q={...(k.q||{}),...q};const f=k.f||(k.f={});if(x.po)f.po=x.po+" boxes";if(x.sm)f.ins=x.sm+" boxes"});
  m.remove();await save();render();alert(`Đã nhập: ${n} item mới${u?`, cập nhật ${u} item`:""}. Số lượng đã điền vào trang thông tin sản phẩm.`)}}

/* ===== Đồng bộ đám mây (Supabase): điện thoại ↔ máy tính ===== */
const SY={get c(){try{return JSON.parse(localStorage.getItem("fir_sync")||"null")}catch(e){return null}},set(v){try{v?localStorage.setItem("fir_sync",JSON.stringify(v)):localStorage.removeItem("fir_sync")}catch(e){}}};
const syOn=()=>{const c=SY.c;return !!(c&&c.url&&c.key&&c.code)};
const syH=j=>{const c=SY.c,h={apikey:c.key};if(/^eyJ/.test(c.key))h.Authorization="Bearer "+c.key;if(j)h["Content-Type"]="application/json";return h};
const syU=p=>SY.c.url.trim().replace(/\/+$/,"")+p;
const syPath=id=>encodeURIComponent(SY.c.code)+"/"+encodeURIComponent(id)+".jpg";
const dq=()=>{try{return JSON.parse(localStorage.getItem("fir_dirty")||"{}")}catch(e){return{}}},dqS=o=>{try{localStorage.setItem("fir_dirty",JSON.stringify(o))}catch(e){}};
let syBusy=0,syLast=(()=>{try{return localStorage.getItem("fir_sylast")||""}catch(e){return""}})();
function syMsg(t,ok){if(ok){syLast=t;try{localStorage.setItem("fir_sylast",t)}catch(e){}}const e=document.getElementById("sys");if(e)e.textContent=t}
function syMark(id,del){if(!syOn()||!id)return;const o=dq();o[id]=(del?"d":"u")+Date.now();dqS(o);netUI();clearTimeout(syMark.t);syMark.t=setTimeout(syPush,2500)}
function netUI(){const e=document.getElementById("net");if(!e)return;const n=syOn()?Object.keys(dq()).length:0,off=!navigator.onLine;if(off){e.hidden=false;e.className="";e.textContent="📴 Đang offline — mọi thay đổi vẫn được lưu trong máy"+(n?` · ${n} báo cáo chờ đồng bộ`:syOn()?"":"")}else if(n){e.hidden=false;e.className="on";e.textContent=`⏳ Đang đồng bộ ${n} báo cáo…`}else e.hidden=true}
addEventListener("online",netUI);addEventListener("offline",netUI);
const imgIds=r=>{const a=[];for(const k of r.skus||[])for(const x of Object.values(k.sec||{}))for(const p of x.ph||[])if(p.id)a.push(p.id);if(r.cfg&&r.cfg.logo)a.push("logo");return a};
async function syErr(r,w){let t="";try{t=(await r.text()).slice(0,160)}catch(e){}return new Error(w+" (lỗi "+r.status+") "+t)}
async function syImgUp(id){if(await idbGet("m","u:"+id))return;const d=asBlob(await idbGet("i",id));if(!d)return;
 const r=await fetch(syU("/storage/v1/object/photos/"+syPath(id)),{method:"POST",headers:{...syH(),"Content-Type":"image/jpeg","x-upsert":"true"},body:d});
 if(!r.ok)throw await syErr(r,"Tải ảnh lên thất bại");await idbPut("m","u:"+id,1)}
async function syImgDown(id){if(!id||!syOn()||!navigator.onLine)return;try{const r=await fetch(syU("/storage/v1/object/authenticated/photos/"+syPath(id)),{headers:syH()});if(!r.ok)return;const b=await r.blob();if(!b.size)return;
 const u=new Blob([b],{type:"image/jpeg"});await idbPut("i",id,u);await idbPut("m","u:"+id,1);return u}catch(e){}}
async function syRow(row){const r=await fetch(syU("/rest/v1/reports?on_conflict=id"),{method:"POST",headers:{...syH(1),Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{...row,code:SY.c.code}])});if(!r.ok)throw await syErr(r,"Lưu báo cáo lên mây thất bại")}
async function syPush(){if(!syOn()||syBusy)return;if(!navigator.onLine){netUI();return syMsg("Đang offline — sẽ đồng bộ khi có mạng")}syBusy=1;
 try{const o=dq(),ks=Object.keys(o);for(const id of ks){const tk=o[id];
   if(tk[0]==="d"){try{const g=await fetch(syU("/rest/v1/reports?id=eq."+encodeURIComponent(id)+"&select=data"),{headers:syH()});const[x]=g.ok?await g.json():[];const ps=x&&x.data?imgIds(x.data).filter(i=>i!=="logo").map(syPath).map(decodeURIComponent):[];
     if(ps.length)await fetch(syU("/storage/v1/object/photos"),{method:"DELETE",headers:syH(1),body:JSON.stringify({prefixes:ps})})}catch(e){}
    await syRow({id,data:null,updated:Date.now(),deleted:true})}
   else{const r=await idbGet("m","r:"+id);if(r){const ids=imgIds(r);let k=0;for(const i of ids){while(document.querySelector(".cam"))await new Promise(r=>setTimeout(r,3000));syMsg("Đang tải ảnh lên… "+(++k)+"/"+ids.length);await syImgUp(i);await new Promise(r=>setTimeout(r,60))}await syRow({id,data:r,updated:r.updated,deleted:false})}}
   const o2=dq();if(o2[id]===tk){delete o2[id];dqS(o2)}}
  syMsg("✓ Đã đồng bộ lúc "+new Date().toLocaleTimeString("vi-VN"),1)}
 catch(e){syMsg("⚠ Chưa đồng bộ được: "+(e&&e.message||e)+" — sẽ tự thử lại")}syBusy=0;netUI()}
async function syPull(only){if(!syOn()||!navigator.onLine)return 0;
 const r=await fetch(syU("/rest/v1/reports?code=eq."+encodeURIComponent(SY.c.code)+(only?"&id=eq."+encodeURIComponent(only):"")+"&select=id,updated,deleted"),{headers:syH()});if(!r.ok)throw await syErr(r,"Không đọc được dữ liệu trên mây");
 const rows=await r.json(),o=dq();let ch=0;
 for(const w of rows){if(o[w.id])continue;const loc=await idbGet("m","r:"+w.id);
  if(w.deleted){if(loc){await delReport(loc,1);ch++}continue}
  if(loc&&loc.updated>=w.updated)continue;
  const g=await fetch(syU("/rest/v1/reports?id=eq."+encodeURIComponent(w.id)+"&select=data"),{headers:syH()});if(!g.ok)continue;const[x]=await g.json();
  if(x&&x.data&&x.data.skus){const mg=loc?mergeRep(x.data,loc):{r:x.data,add:0};await idbPut("m","r:"+w.id,mg.r);if(mg.add)syMark(w.id);ch++}}
 return ch}
/* bản trên mây mới hơn: lấy bản mây nhưng KHÔNG làm rơi ảnh chỉ có trong máy này */
function mergeRep(rm,lc){const r=JSON.parse(JSON.stringify(rm)),have=new Set();let add=0;for(const k of r.skus)for(const x of Object.values(k.sec||{}))for(const p of x.ph||[])if(p.id)have.add(p.id);
 for(const lk of lc.skus||[]){let k=r.skus.find(z=>z.id===lk.id);const lp=Object.values(lk.sec||{}).some(x=>(x.ph||[]).some(p=>p.id&&!have.has(p.id)));if(!lp)continue;
  if(!k){if(r.skus.length>=MAXI)continue;r.skus.push(JSON.parse(JSON.stringify(lk)));add++;continue}
  for(const[sk,lx]of Object.entries(lk.sec||{})){const nw=(lx.ph||[]).filter(p=>p.id&&!have.has(p.id));if(!nw.length)continue;const x=k.sec[sk]||(k.sec[sk]={...lx,ph:[]});for(const p of nw){x.ph.push({...p});have.add(p.id);add++}}}
 if(add)r.updated=Date.now();return{r,add}}
async function syNow(show){if(!syOn())return;try{await syPush();const ch=await syPull();if(!dq()||!Object.keys(dq()).length)syMsg("✓ Đã đồng bộ lúc "+new Date().toLocaleTimeString("vi-VN")+(ch?" · nhận "+ch+" thay đổi":""),1);if(ch&&V.p==="list")render()}catch(e){syMsg("⚠ "+(e&&e.message||e))}}
function syLink(){const c=SY.c;return location.origin+location.pathname+"#sync="+btoa(unescape(encodeURIComponent(JSON.stringify(c))))}
function syCard(){const c=SY.c||{};if(!syOn())return`<div class=c><h2>Đồng bộ điện thoại ↔ máy tính</h2><p class=tip>Kết nối kho dữ liệu Supabase (miễn phí) để báo cáo làm trên điện thoại tự hiện trên máy tính. Nếu đã kết nối ở máy khác, chỉ cần mở <b>link kết nối</b> được gửi từ máy đó.</p>
 <label>Supabase Project URL</label><input id=su placeholder="https://xxxx.supabase.co" value="${esc(c.url||"")}"><label>Supabase anon / publishable key</label><input id=sk placeholder="eyJ… hoặc sb_publishable_…" value="${esc(c.key||"")}"><label>Mã nhóm (máy nào cùng mã sẽ thấy chung báo cáo)</label><input id=sc placeholder="vd: qc-team-2026" value="${esc(c.code||"")}">
 <p><button class="b y" id=sok>Kết nối</button></p><p class=tip id=sys></p></div>`;
 return`<div class=c><h2>Đồng bộ điện thoại ↔ máy tính</h2><p class=tip>Đang bật · mã nhóm <b>${esc(c.code)}</b></p><p class=tip id=sys>${esc(syLast||"")}</p><div class=r><button class="b y" id=snw>🔄 Đồng bộ ngay</button><button class="b g" id=slk>🔗 Gửi link kết nối cho máy khác</button></div><p><button class="b x" id=sof>Ngắt đồng bộ trên máy này</button></p></div>`}
function syBind(a){const q=s=>a.querySelector(s);
 if(q("#sok"))q("#sok").onclick=async()=>{const v={url:q("#su").value.trim(),key:q("#sk").value.trim(),code:q("#sc").value.trim()};if(!/^https:\/\/.+/.test(v.url)||!v.key||!v.code)return alert("Điền đủ URL (bắt đầu bằng https://), key và mã nhóm.");SY.set(v);syMsg("Đang kiểm tra kết nối…");
  try{const r=await fetch(syU("/rest/v1/reports?select=id&limit=1"),{headers:syH()});if(!r.ok)throw await syErr(r,"Supabase từ chối");const o=dq();for(const x of await allReports())o[x.id]="u"+Date.now();dqS(o);await syNow();render()}catch(e){SY.set(null);syMsg("⚠ Không kết nối được: "+(e&&e.message||e))}};
 if(q("#snw"))q("#snw").onclick=()=>{syMsg("Đang đồng bộ…");syNow()};
 if(q("#slk"))q("#slk").onclick=async()=>{const l=syLink();try{if(navigator.share){await navigator.share({title:"Link kết nối báo cáo kiểm hàng",url:l});return}}catch(e){if(e&&e.name==="AbortError")return}try{await navigator.clipboard.writeText(l);alert("Đã sao chép link. Dán và mở link này trên máy tính (hoặc máy khác).")}catch(e){prompt("Sao chép link này và mở trên máy khác:",l)}};
 if(q("#sof"))q("#sof").onclick=()=>{if(confirm("Ngắt đồng bộ trên máy này? Báo cáo trong máy vẫn giữ nguyên.")){SY.set(null);render()}}}
function syInit(){const h=location.hash.match(/^#sync=(.+)$/);if(h){try{const v=JSON.parse(decodeURIComponent(escape(atob(h[1]))));if(v.url&&v.key&&v.code){SY.set(v);alert("Đã kết nối đồng bộ (mã nhóm: "+v.code+"). Báo cáo từ các máy khác sẽ tự tải về.")}}catch(e){}history.replaceState(null,"",location.pathname)}
 if(!syOn())return;const tick=()=>{if(document.visibilityState==="visible")syNow()};setTimeout(tick,800);setInterval(tick,20000);addEventListener("online",tick);document.addEventListener("visibilitychange",tick)}

(async()=>{try{db=await openDB();const old=await idbGet("m","s");if(old){old.id=old.id||uid();old.created=old.updated=Date.now();await idbPut("m","r:"+old.id,old);await idbDel("m","s")}
  syInit();setTimeout(migrateImgs,4000)}catch(e){alert("Trình duyệt không cho lưu dữ liệu. Hãy mở file bằng Chrome/Safari và đừng dùng chế độ ẩn danh.")}
  S=S||blank();render();netUI();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}})();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
